# 场景参数（相机内参和引导灯坐标不在这里）。
#
# 两个和识别包共用的配置文件放在同一目录：
#   real_light_centers.yaml  四个引导灯的坐标（格式和 dart_track/config 下那份完全一样）
#   ost.yaml                 相机内参（camera_calibration 的 ost.yaml 格式）
# 改完这两个文件直接重启仿真即可，画面和真值都会跟着变；
# 把这两个文件复制到识别包的 config 下，测量和解算用的就是同一套参数。
#
# Frames
#   throw:  origin at the launcher, +y = horizontal launch direction,
#           +z = up, +x = right.  The dart flies in the x = 0 plane.
#   camera: OpenCV optical frame, from the eye/target/up look-at pose.
#
# Everything here is in metres / seconds.

frame:
  fps: 30.0

camera:
  # 相机在 throw 下的安装位置（内参来自 ost.yaml）
  eye: [-3.8, 1.9, 1.8]
  target: [0.0, 2.2, 0.7]
  up: [0.0, 0.0, 1.0]

lights:
  # 灯只在这里配置半径；位置在 real_light_centers.yaml
  radius: 0.06

dart:
  origin: [0.0, 0.0, 0.6]
  speed: 6.0
  elevation_deg: 35.0
  gravity: 9.81
  strip_length: 0.15
  strip_width: 0.03

render:
  background: 18.0
  noise_sigma: 2.5
  light_gain: 255.0
  dart_gain: 255.0
  # RGB 0..1. Green guide lights + green dart strip (same colour as the lights;
  # recognition separates them by area / aspect ratio).
  light_color: [0.15, 1.0, 0.32]
  dart_color: [0.15, 1.0, 0.32]
  exposure_frac: 0.5
  motion_blur_samples: 5
  clutter: 6
  seed: 7
