/**:
  ros__parameters:
    # 单位：m，发射系（throw：原点=发射基站，+y=水平发射方向，+z=向上，+x=右手边）
    #
    # 这份文件和 dart_track/config/real_light_centers.yaml 完全同格式：
    #   - 仿真按它摆放引导灯；
    #   - 直接复制到识别包的 config 下，就能让解算用上同一组坐标。
    #
    # 排列：图像里的 左上、右上、右下、左下（和 recognition 排完序的顺序一致）。
    # 你改这里的坐标，仿真画面和打分都会跟着变。
    point_0: [ 0.5, 3.5, 0.0]
    point_1: [ 0.5, 2.0, 0.0]
    point_2: [-0.5, 2.0, 0.0]
    point_3: [-0.5, 3.5, 0.0]
